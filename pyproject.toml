[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lock_demo"
version = "0.1.0"
description = "Uni-Lab-OS 调度锁演示设备包：动作锁串行、always_free 并行、物料锁按板互斥"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["unilabos", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["lock_demo*"]

[tool.setuptools.data-files]
"share/lock_demo/graph" = ["graph/*.json"]
